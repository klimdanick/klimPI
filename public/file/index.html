<div class="container">
<form action="/upload/default" method="post" enctype="multipart/form-data" class="form">
  <label for="file" class="custom-file-upload">Select file</label>
  <input name="file" type="file" id="file" oninput="fileSelected()">
  <label for="submit" class="custom-submit">Upload</label>
  <button id="submit">Upload</button>
</form>
</div>
<script>
  function fileSelected() {
    let file = document.getElementsByTagName("form")[0].children[1].value;
    if (file) {
      file = file.split("\\");
      file = file[file.length-1];
      document.getElementsByClassName("custom-file-upload")[0].innerHTML = file;
    }
  }
</script>
<style>
  .container {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    align-items: center;
    display: flex;
    justify-content: center;
    background: linear-gradient(to top right, #081017 0%, #101f2c 100%);
    font: 20px / 50px D-DIN-Bold, Arial, Verdana, sans-serif;
  }

  .form { 
    position: relative;
    width: 400px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: row;
  }

  input[type="file"], button {
    display: none;
  }

  .custom-file-upload {
    width: 80%;
    background: white;
    border-radius: 10px 0px 0px 10px;
    height: 60px;
    text-align:center;
  }

  .custom-submit {
    width: 20%;
    background: #05d993;
    color: white;
    border-radius: 0px 10px 10px 0px;
    height: 60px;
    text-align: center;
  }

</style>
