<div class="container"></div>

<style>
.container {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    align-items: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: linear-gradient(to top right, #081017 0%, #101f2c 100%);
    font: 20px / 50px D-DIN-Bold, Arial, Verdana, sans-serif;
    color: white;
}
</style>
<script>
    let files

    window.onload = () => {getFiles();}

    async function getFiles() {
        files = await fetch("/fileList").then((response) => response.json());
        console.log(files);
        Object.values(files).map((file) => {
            document.getElementsByClassName("container")[0].innerHTML += "<a href=\"https://vps.klimdanick.nl/download/"+file.hash+"\" onclick=\"copyLink('"+file.hash+"')\">"+file.name + "</a>";
        })
    }

    function copyLink(hash) {
        navigator.clipboard.writeText("https://vps.klimdanick.nl/download/"+hash);
    }
</script>
