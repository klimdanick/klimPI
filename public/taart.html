<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.2.0/p5.min.js"></script>
</head>
<body style="background: black; display: flex; flex-direction: column; align-items: center;">
<h1 style="color: white">Hoe maak je cyber-brood? met e-mail...</h1>
<image src="https://vps.klimdanick.nl/download/taart.jpg" style="width: 50%; height: auto;"/>
<div class="canvas-container" style="position: absolute; left: 0; top: 0; width: 100; height: 100; z-index: -1;"></div>
<h2 class="powned" style="position: absolute; color:black"">YOU HAVE BEEN POWNED</h2>
<h2 class="powned" style="position: absolute; color:black"">YOU HAVE BEEN POWNED</h2>
<h2 class="powned" style="position: absolute; color:black"">YOU HAVE BEEN POWNED</h2>
<h2 class="powned" style="position: absolute; color:black"">YOU HAVE BEEN POWNED</h2>
</body>
<style>
    .powned{
        padding: 10px;
    }
</style>
<script>
    let index = 0;
    setInterval(() => {
        let powned = document.documentElement.getElementsByClassName("powned");

        for (let i = 0; i < powned.length; i++) {
            let color = "red";
            if (index % 2 == 0) color = "white"
            powned[i].style.background = color; 
            let x = Math.random() * 90;
            let y = Math.random() * 90;
            powned[i].style.top = y+"%";
            powned[i].style.left = x+"%"; 
        }
        index+=1;
    }, 500);

    let vehicle = [];
    const CHAR_SIZE = 20;
    let columns = [];
    
    function setup() {
      let canvas = createCanvas(windowWidth, windowHeight);
      canvas.elt.style.zIndex = 10
      document.documentElement.getElementsByClassName("canvas-container")[0].appendChild(canvas.elt)
      vehicle[0] = new Vehicle(Math.floor(Math.random() * width), Math.floor(Math.random() * height));
      vehicle[1] = new Vehicle(Math.floor(Math.random() * width), Math.floor(Math.random() * height));
      vehicle[2] = new Vehicle(Math.floor(Math.random() * width), Math.floor(Math.random() * height));
      vehicle[3] = new Vehicle(Math.floor(Math.random() * width), Math.floor(Math.random() * height));
      textSize(CHAR_SIZE);
        for (let i = 0; i < width; i += CHAR_SIZE) {
            columns.push(new Column(i, random(-1000, 0)));
        }
    }
    
    function draw() {
      resizeCanvas(windowWidth, windowHeight);
      background(8,16,23);
      columns.forEach(column => column.render());
      target= new Target(mouseX, mouseY);
    
      for (let i = 0; i < 4; i++) {
          vehicle[i].wander();
          vehicle[i].update();
          vehicle[i].show();
          vehicle[i].edges();
      }
    }
    
    class Vehicle {
    constructor(x, y) {
      this.img = loadImage('https://cdn-icons-png.freepik.com/512/8070/8070727.png');
      this.color = color(255,255,0, 50);
      this.pos = createVector(x, y);
      this.vel = createVector(1, 0);
      this.acc = createVector(0, 0);
      this.maxSpeed = 4;
      this.maxForce = 0.2;
      this.r = 16;
    
      this.wanderTheta = PI / 2;
      this.xoff = Math.floor(Math.random() * 1000);
    
      this.currentPath = [];
      this.paths = [this.currentPath];
    }
    
    wander() {
      let angle = noise(this.xoff) * TWO_PI * 2;
      let steer = p5.Vector.fromAngle(angle);
      steer.setMag(this.maxForce);
      this.applyForce(steer);
      this.xoff += 0.01;
    }
    
    evade(vehicle) {
      let pursuit = this.pursue(vehicle);
      pursuit.mult(-1);
      return pursuit;
    }
    
    pursue(vehicle) {
      let target = vehicle.pos.copy();
      let prediction = vehicle.vel.copy();
      prediction.mult(10);
      target.add(prediction);
      fill(0, 255, 0);
      circle(target.x, target.y, 16);
      return this.seek(target);
    }
    
    arrive(target) {
      return this.seek(target, true);
    }
    
    flee(target) {
      return this.seek(target).mult(-1);
    }
    
    seek(target, arrival = false) {
      let force = p5.Vector.sub(target, this.pos);
      let desiredSpeed = this.maxSpeed;
      if (arrival) {
        let slowRadius = 100;
        let distance = force.mag();
        if (distance < slowRadius) {
          desiredSpeed = map(distance, 0, slowRadius, 0, this.maxSpeed);
        }
      }
      force.setMag(desiredSpeed);
      force.sub(this.vel);
      force.limit(this.maxForce);
      return force;
    }
    
    applyForce(force) {
      this.acc.add(force);
    }
    
    update() {
      this.vel.add(this.acc);
      this.vel.limit(this.maxSpeed);
      this.pos.add(this.vel);
      this.acc.set(0, 0);
    
      this.currentPath.push(this.pos.copy());
    
      let total = 0;
      for (let path of this.paths) {
        total += path.length;
      }
    
      if (total > 200 || (total > 10 && millis() > 3000)) {
        this.paths[0].shift();
        if (this.paths[0].length === 0) {
          this.paths.shift();
        }
      }
    }
    
    show() {
      push();
      translate(this.pos.x, this.pos.y); 
      rotate(this.vel.heading() + PI / 2);
      imageMode(CENTER);
      image(this.img, 0, 0, this.r * 2, this.r * 2);
      pop();
    
      stroke(this.color);
      strokeWeight(2);
      noFill();
      for (let path of this.paths) {
        beginShape();
        for (let v of path) {
          vertex(v.x, v.y);
        }
        endShape();
      }
    }
    
    edges() {
      let hitEdge = false;
      if (this.pos.x > width + this.r) {
        this.pos.x = -this.r;
        hitEdge = true;
      } else if (this.pos.x < -this.r) {
        this.pos.x = width + this.r;
        hitEdge = true;
      }
      if (this.pos.y > height + this.r) {
        this.pos.y = -this.r;
        hitEdge = true;
      } else if (this.pos.y < -this.r) {
        this.pos.y = height + this.r;
        hitEdge = true;
      }
    
      if (hitEdge) {
        this.currentPath = [];
        this.paths.push(this.currentPath);
      }
    }
    }
    
    class Target extends Vehicle {
    constructor(x, y) {
      super(x, y);
      this.vel = p5.Vector.random2D();
      this.vel.mult(0);
    }
    
    show() {
      stroke(255);
      strokeWeight(2);
      fill("#F063A4");
      push();
      translate(this.pos.x, this.pos.y);
      circle(0, 0, this.r * 2);
      pop();
    }
    }
    
    class MatrixSymbol {
  constructor(x, y, speed, col) {
    this.x = x;
    this.y = y;
    this.value = this.setRandomSymbol();
    this.speed = speed;
    this.color = col;
    this.interval = round(random(21, 60));
  }
  
  setRandomSymbol() {
    return String.fromCharCode(0x30A0 + round(random(0, 96)));
  }
  
  scroll() {
    this.y += this.speed;
    if (this.y > height + CHAR_SIZE) {
      this.y = -CHAR_SIZE;
    }
  }
    
  update() {
    this.scroll();
    if (frameCount % this.interval === 0) {
      this.value = this.setRandomSymbol();
    }
  }
  
  render() {
    fill(this.color);
    text(this.value, this.x, this.y);
  }
}


class Column {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.symbols = [];
    this.totalSymbols = round(random(10, 20));
    this.speed = random(2,4);
    this.setup();
  }

  setup() {
    for (let i = 0; i < this.totalSymbols; i++) {
      let letterColor;
      
      if (i === 0 && random(1) > 0.4) {
        letterColor = color(200, 250, 200);
      } else {
        letterColor = color(20, 185, 70);
      }
      
      const symbol = new MatrixSymbol(
        this.x,
        this.y,
        this.speed,
        letterColor
      );
      
      this.symbols.push(symbol);
      this.y -= CHAR_SIZE;
    }
  }

  render() {
    this.symbols.forEach(symbol => {
      symbol.update();
      symbol.render();
    });
  }
}
    </script>
