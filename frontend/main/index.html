<script src="https://klimdanick.nl/elementaljs/src/Elemental.js"></script>
<script src="dashboard/dashboard.js"></script>
<link rel="stylesheet" href="dashboard/dashboard.css">
<script src="processes/processes.js"></script>
<script src="files/files.js"></script>
<script src="proxy/proxy.js"></script>
<script src="notes/notes.js"></script>
<link rel="stylesheet" href="processes/processes.css">
<link rel="stylesheet" href="proxy/proxy.css">
<link rel="stylesheet" href="notes/notes.css">
<link rel="stylesheet" href="notes/markdown.css">
<script>

    if (!window.location.pathname.endsWith("/")) window.location = window.location + "/";

    let user = null;

    fetch("/authAPI/user", {
        method: "get"
    }).then(res => res.json()).then(json => {
        if (json.roles.includes("guest")) {
            window.location = "https://klimdanick.nl/auth/?" + window.location
        }
        else user = json;
    })

    let layout, mainMenu;

    OnElementalLoad = () => {

        layout = Layout.row({ id: "mainLayout" });
        let title = new Header({ level: 1, attributes: { style: "font-size: 1.2em; font-weight: bold; display: flex; align-items: center; flex-direction: row; gap: 0.1em" } }).append(
            "KLIM ",
            new Icon({ src: "assets/pi-logo.svg", attributes: { style: "width: 100%" } }
            ));
        mainMenu = new Menu().append(
            new Element({tag: "div", attributes: {style: "display: flex; justify-content: center;"}}).append(title),
            new MenuItem({ label: "notes", icon: new Icon({ src: getEjsAsset("messages") }), action: () => loadPage(createNotesDisplay()) }),
            new MenuItem({ label: "files", icon: new Icon({ src: getEjsAsset("file") }), action: () => loadPage(createFileList()) }),
        )

        if (hasAccess("view_dashboard")) mainMenu.append(new MenuItem({ label: "dashboard", icon: new Icon({ src: "assets/dashboard.svg" }), action: () => loadPage(createDashboard()) }))
        if (hasAccess("view_processes")) mainMenu.append(new MenuItem({ label: "processes", icon: new Icon({ src: "assets/process.svg" }), action: () => loadPage(createProcesses()) }))
        if (hasAccess("view_proxy")) mainMenu.append(new MenuItem({ label: "proxy", icon: new Icon({ src: "assets/proxy.svg" }), action: () => loadPage(createProxy()) }))
        if (hasAccess("view_users")) mainMenu.append(new MenuItem({ label: "users", icon: new Icon({ src: "assets/users.svg" }), action: () => loadPage() }))


        mainMenu.id = "mainMenu"

        layout.append(mainMenu)

        body.append(layout)
        body.render();

        if (hasAccess("view_dashboard")) loadPage(createDashboard())
        else loadPage(createNotesDisplay());

        createFileList()
        createProcesses()
        createDashboard()
        createProxy()
        createNotesDisplay()
    }

    const loadPage = (page) => {
        layout.clear();
        layout.append(mainMenu);
        if (page) layout.append(page);
        body.render();
    }

    const levels = {
        Admin: 0
    }

    const permissions = {
        admin: [
            "view_dashboard",
            "view_processes",
            "restart_processes",
            "start_processes",
            "stop_processes",
            "edit_processes",
            "view_proxy",
            "edit_proxy",
            "view_users",
            "edit_users",
        ],
        operator: [
            "view_dashboard",
            "view_processes",
            "restart_processes",
            "start_processes",
            "view_proxy",
        ],
        guest: []
    }

    const hasAccess = (permission, user_ = user) => {
        let ret = false
        user_.roles.forEach(role => {
            if (permissions[role]?.includes(permission)) ret = true;
        });
        return ret;
    }
</script>
<style>
    svg {
        width: 1em;
    }

    #mainLayout {
        width: 100%;
        height: 100%;
        justify-content: flex-start;
        padding: 0;
        gap: 0;
    }

    #mainMenu {
        font-size: 1.5em;
        height: 100%;
        width: 200px;
    }

    .mainContent {
        width: 100%;
        height: 100%;
        --level: keep;
    }
</style>
